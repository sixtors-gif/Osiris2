<script src="scorm.js"></script><script>const qs=[["¿Qué debe hacerte sospechar de un mensaje?", "Que pida una contraseña o código con urgencia.", "Que te salude por tu nombre", "Que incluya el logotipo de la empresa", "Que llegue en horario de clase"], ["¿Qué es 2FA?", "Una segunda prueba de identidad además de la contraseña.", "Cambiar de móvil", "Crear una segunda cuenta", "Tener dos contraseñas iguales"], ["¿Qué haces con una contraseña reutilizada?", "La sustituyes por una contraseña exclusiva para ese servicio.", "Compartirla con amigos", "Publicarla en una nota visible", "Usarla también para el correo"], ["¿Qué es phishing?", "Un engaño que intenta obtener datos haciéndose pasar por una fuente legítima.", "Una actualización", "Una copia de seguridad", "Una red Wi-Fi"], ["¿Qué haces ante un enlace inesperado?", "No introduces datos y verificas el servicio por un canal oficial.", "Hacer clic rápidamente", "Desactivar la seguridad", "Reenviarlo a un amigo"], ["¿Qué es la huella digital?", "La información y rastro que dejamos con nuestra actividad en Internet.", "Solo las fotos del móvil", "Únicamente los videojuegos", "Nada que tenga que ver contigo"], ["¿Qué dato conviene proteger especialmente?", "Contraseñas y códigos de acceso.", "El nombre de tu videojuego favorito", "El nombre de una app", "El color del móvil"], ["¿Qué haces con las actualizaciones?", "Mantienes sistema y aplicaciones actualizados desde fuentes oficiales.", "Ignorarlas siempre", "Instalar archivos aleatorios", "Desactivarlas"], ["¿Qué es malware?", "Software malicioso.", "Una red Wi-Fi", "Una contraseña fuerte", "Una copia de seguridad"], ["¿Qué indica que una descarga puede ser peligrosa?", "Que procede de una fuente dudosa o pide desactivar protecciones.", "Que sea de la web oficial", "Que sea un anuncio", "Que pida permisos razonables"], ["¿Qué haces si un supuesto moderador pide tu código?", "No lo compartes y utilizas el soporte oficial.", "Darle el código", "Publicarlo", "Darle también la contraseña"], ["¿Qué haces con contenido humillante de otra persona?", "No lo reenvías y buscas ayuda/reportas cuando corresponda.", "Reenviarlo", "Añadir comentarios", "Hacer una captura y difundirla"], ["Si sospechas que han entrado en tu cuenta, ¿qué haces?", "Cambias la contraseña, cierras sesiones y activas 2FA.", "Publicar la contraseña", "Ignorarlo", "Crear otra cuenta y abandonar la anterior"], ["¿Por qué no conviene publicar una ubicación en tiempo real?", "Porque puede revelar dónde estás o tus rutinas.", "Porque gasta más batería", "Porque ocupa memoria", "Porque cambia el color de las fotos"], ["¿Qué es una buena práctica con apps?", "Instalarlas desde fuentes oficiales y revisar sus permisos.", "Aceptar todos los permisos sin leerlos", "Archivos aleatorios", "Apps modificadas desconocidas"], ["¿Qué debes hacer si un sitio te pide desactivar el antivirus?", "No seguir la indicación y abandonar la descarga.", "Seguir la instrucción", "Desactivar el móvil", "Enviar el archivo a más personas"], ["¿El soporte legítimo necesita tu contraseña?", "No.", "Sí, siempre", "Sí, si dice ser urgente", "Sí, si conoce tu nombre"], ["¿Qué hacer ante un problema grave online?", "Pedir ayuda a una persona adulta o responsable y utilizar canales oficiales.", "No contarle nada a nadie", "Buscar un programa desconocido", "Publicar los datos del incidente"], ["¿Qué significa semáforo rojo?", "Parar porque hay señales claras de riesgo.", "Hacer clic sin mirar", "Dar el código", "Compartir el mensaje"], ["¿Cuál es el objetivo del curso?", "Convertir la seguridad digital en hábitos sencillos y aplicables.", "Aprender a desactivar el antivirus", "Aprender a hackear personas", "Conseguir más seguidores"]];let answers={};const root=document.getElementById('exam');qs.forEach((x,i)=>{let opts=x.slice(1).sort(()=>Math.random()-.5);const box=document.createElement('div');box.className='quiz';const h=document.createElement('h4');h.textContent=(i+1)+'. '+x[0];box.appendChild(h);const wrap=document.createElement('div');wrap.className='options';opts.forEach(o=>{const d=document.createElement('div');d.className='option';d.dataset.q=i;d.textContent=o;d.onclick=function(){pick(d,o,x[1])};wrap.appendChild(d)});box.appendChild(wrap);root.appendChild(box)});function pick(el,val,correct){document.querySelectorAll('[data-q="'+el.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');answers[el.dataset.q]=val}function finishExam(){let score=0;qs.forEach((x,i)=>{if(answers[i]===x[1])score++});let pct=Math.round(score/qs.length*100);let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>${pct>=70?'🎉 ¡Muy bien!':'💪 Buen intento'}</h2><p>Resultado: <b>${score}/${qs.length} (${pct}%)</b></p><p>${pct>=70?'Has demostrado que sabes aplicar hábitos básicos de ciberseguridad.':'Repasa los módulos y vuelve a intentarlo. Lo importante es aprender a reconocer las situaciones de riesgo.'}</p>`;if(window.scorm)scorm.complete(pct);window.scrollTo({top:r.offsetTop,behavior:'smooth'})}</script></body></html>
