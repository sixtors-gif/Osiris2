<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Los cinco parámetros de un signo" font-family="Segoe UI,Tahoma,sans-serif"><rect width="960" height="250" fill="#fff"/><text x="480" y="34" font-size="20" fill="#0f766e" text-anchor="middle" font-weight="700">Un signo = 5 parámetros a la vez</text><rect x="10" y="60" width="170" height="150" rx="14" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><circle cx="95" cy="82" r="16" fill="#f97316"/><text x="95" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="95" y="122" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Configuración</text><text x="95" y="160" font-size="12" fill="#333" text-anchor="middle" font-weight="400">la forma de la mano</text><rect x="190" y="60" width="170" height="150" rx="14" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><circle cx="275" cy="82" r="16" fill="#f97316"/><text x="275" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="275" y="122" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Orientación</text><text x="275" y="160" font-size="12" fill="#333" text-anchor="middle" font-weight="400">hacia dónde miran la</text><text x="275" y="176" font-size="12" fill="#333" text-anchor="middle" font-weight="400">palma y los dedos</text><rect x="370" y="60" width="170" height="150" rx="14" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><circle cx="455" cy="82" r="16" fill="#f97316"/><text x="455" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="455" y="122" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Lugar</text><text x="455" y="160" font-size="12" fill="#333" text-anchor="middle" font-weight="400">dónde se hace: cara,</text><text x="455" y="176" font-size="12" fill="#333" text-anchor="middle" font-weight="400">pecho, espacio…</text><rect x="550" y="60" width="170" height="150" rx="14" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><circle cx="635" cy="82" r="16" fill="#f97316"/><text x="635" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="635" y="122" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Movimiento</text><text x="635" y="160" font-size="12" fill="#333" text-anchor="middle" font-weight="400">cómo se mueven las</text><text x="635" y="176" font-size="12" fill="#333" text-anchor="middle" font-weight="400">manos</text><rect x="730" y="60" width="170" height="150" rx="14" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><circle cx="815" cy="82" r="16" fill="#f97316"/><text x="815" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="815" y="122" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Componentes no</text><text x="815" y="138" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">manuales</text><text x="815" y="176" font-size="12" fill="#333" text-anchor="middle" font-weight="400">cara, mirada, cabeza</text><text x="815" y="192" font-size="12" fill="#333" text-anchor="middle" font-weight="400">y cuerpo</text></svg>