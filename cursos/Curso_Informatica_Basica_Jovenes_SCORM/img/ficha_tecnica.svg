<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Ficha técnica de un portátil de ejemplo con la explicación de cada dato" font-family="Segoe UI,Tahoma,Verdana,sans-serif">
<title>Ficha técnica de un portátil de ejemplo con la explicación de cada dato</title>
<rect width="720" height="380" rx="18" fill="#ffffff"/>
<rect x="20" y="16" width="680" height="44" rx="10" fill="#1e3c72"/><text x="360" y="45" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle">Portátil de ejemplo · Ficha técnica</text><rect x="20" y="72" width="680" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="96" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Procesador</text><text x="220" y="96" font-size="14" fill="#111827" font-weight="600" text-anchor="start">8 núcleos, hasta 4,4 GHz</text><text x="684" y="96" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← cerebro: rapidez al trabajar</text><rect x="20" y="114" width="680" height="36" rx="8" fill="#f4f7fb" stroke="#e5e7eb"/><text x="36" y="138" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Memoria RAM</text><text x="220" y="138" font-size="14" fill="#111827" font-weight="600" text-anchor="start">16 GB</text><text x="684" y="138" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← cuántas cosas abiertas a la vez</text><rect x="20" y="156" width="680" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="180" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Almacenamiento</text><text x="220" y="180" font-size="14" fill="#111827" font-weight="600" text-anchor="start">SSD 512 GB</text><text x="684" y="180" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← espacio para archivos y velocidad</text><rect x="20" y="198" width="680" height="36" rx="8" fill="#f4f7fb" stroke="#e5e7eb"/><text x="36" y="222" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Gráfica</text><text x="220" y="222" font-size="14" fill="#111827" font-weight="600" text-anchor="start">integrada</text><text x="684" y="222" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← suficiente para clase y vídeo</text><rect x="20" y="240" width="680" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="264" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Pantalla</text><text x="220" y="264" font-size="14" fill="#111827" font-weight="600" text-anchor="start">15,6" Full HD (1920×1080)</text><text x="684" y="264" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← tamaño y nitidez</text><rect x="20" y="282" width="680" height="36" rx="8" fill="#f4f7fb" stroke="#e5e7eb"/><text x="36" y="306" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Batería</text><text x="220" y="306" font-size="14" fill="#111827" font-weight="600" text-anchor="start">hasta 10 h (según fabricante)</text><text x="684" y="306" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← autonomía real: suele ser menor</text><rect x="20" y="324" width="680" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/><text x="36" y="348" font-size="14" fill="#1e3c72" font-weight="800" text-anchor="start">Sistema operativo</text><text x="220" y="348" font-size="14" fill="#111827" font-weight="600" text-anchor="start">preinstalado o sin SO</text><text x="684" y="348" font-size="12" fill="#44a08d" font-weight="700" text-anchor="end">← comprueba si viene incluido</text>
</svg>
