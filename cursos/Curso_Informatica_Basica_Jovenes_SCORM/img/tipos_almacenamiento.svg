<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Tipos de almacenamiento: disco duro, SSD, memoria USB, tarjeta SD y nube" font-family="Segoe UI,Tahoma,Verdana,sans-serif">
<title>Tipos de almacenamiento: disco duro, SSD, memoria USB, tarjeta SD y nube</title>
<rect width="720" height="300" rx="18" fill="#ffffff"/>
<g transform="translate(30,60) scale(1.3)"><rect x="0" y="0" width="90" height="64" rx="8" fill="#6b7280"/><circle cx="38" cy="32" r="24" fill="#d9dee7"/><circle cx="38" cy="32" r="5" fill="#6b7280"/><line x1="70" y1="10" x2="44" y2="30" stroke="#1e3c72" stroke-width="4" stroke-linecap="round"/></g><text x="88" y="175" font-size="18" fill="#1e3c72" font-weight="800" text-anchor="middle">HDD</text><text x="88" y="195" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">barato · lento</text><g transform="translate(175,62)"><rect x="0" y="0" width="110" height="80" rx="8" fill="#1f2937"/><rect x="10" y="18" width="24" height="44" rx="3" fill="#374151" stroke="#4ecdc4"/><rect x="43" y="18" width="24" height="44" rx="3" fill="#374151" stroke="#4ecdc4"/><rect x="76" y="18" width="24" height="44" rx="3" fill="#374151" stroke="#4ecdc4"/></g><text x="230" y="175" font-size="18" fill="#1e3c72" font-weight="800" text-anchor="middle">SSD</text><text x="230" y="195" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">rápido · sin piezas móviles</text><g transform="translate(330,70)"><rect x="0" y="20" width="70" height="40" rx="8" fill="#ff6b6b"/><rect x="70" y="28" width="26" height="24" fill="#9ca3af"/><rect x="78" y="33" width="5" height="5" fill="#ffffff"/><rect x="87" y="33" width="5" height="5" fill="#ffffff"/></g><text x="375" y="175" font-size="18" fill="#1e3c72" font-weight="800" text-anchor="middle">USB</text><text x="375" y="195" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">para llevar</text><g transform="translate(455,62)"><path d="M0,0 h48 l16,16 v64 h-64 z" fill="#1e3c72"/><rect x="8" y="6" width="7" height="16" fill="#ffd166"/><rect x="20" y="6" width="7" height="16" fill="#ffd166"/><rect x="32" y="6" width="7" height="16" fill="#ffd166"/><rect x="44" y="6" width="7" height="16" fill="#ffd166"/></g><text x="487" y="175" font-size="18" fill="#1e3c72" font-weight="800" text-anchor="middle">Tarjeta SD</text><text x="487" y="195" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">móviles y cámaras</text><g transform="translate(570,70)"><circle cx="40" cy="45" r="28" fill="#bfefff"/><circle cx="75" cy="35" r="34" fill="#bfefff"/><circle cx="110" cy="50" r="24" fill="#bfefff"/><rect x="40" y="45" width="70" height="29" fill="#bfefff"/></g><text x="645" y="175" font-size="18" fill="#1e3c72" font-weight="800" text-anchor="middle">Nube</text><text x="645" y="195" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">necesita Internet</text><rect x="40" y="230" width="640" height="10" rx="5" fill="#e5e7eb"/><rect x="40" y="230" width="640" height="10" rx="5" fill="url(#g)"/><defs><linearGradient id="g"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#44a08d"/></linearGradient></defs><text x="40" y="265" font-size="13" fill="#6b7280" font-weight="600" text-anchor="start">más lento</text><text x="680" y="265" font-size="13" fill="#6b7280" font-weight="600" text-anchor="end">más rápido</text><text x="360" y="265" font-size="12" fill="#6b7280" font-weight="500" text-anchor="middle">velocidad aproximada (depende del modelo y de la conexión)</text>
</svg>
