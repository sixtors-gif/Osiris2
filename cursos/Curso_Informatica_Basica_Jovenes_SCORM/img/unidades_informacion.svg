<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Escalera de unidades de información: bit, byte, kilobyte, megabyte, gigabyte y terabyte" font-family="Segoe UI,Tahoma,Verdana,sans-serif">
<title>Escalera de unidades de información: bit, byte, kilobyte, megabyte, gigabyte y terabyte</title>
<rect width="720" height="320" rx="18" fill="#ffffff"/>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/></marker></defs><rect x="20" y="230" width="105" height="70" rx="10" fill="#4ecdc4"/><text x="72" y="262" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">bit</text><text x="72" y="284" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">0 o 1</text><rect x="137" y="194" width="105" height="106" rx="10" fill="#44a08d"/><text x="189" y="226" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">Byte</text><text x="189" y="248" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">8 bits</text><text x="189" y="263" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">una letra</text><text x="131" y="186" font-size="13" fill="#6b7280" font-weight="700" text-anchor="middle">×8</text><rect x="254" y="158" width="105" height="142" rx="10" fill="#1e3c72"/><text x="306" y="190" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">KB</text><text x="306" y="212" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">un texto</text><text x="306" y="227" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">corto</text><text x="248" y="150" font-size="13" fill="#6b7280" font-weight="700" text-anchor="middle">×1024</text><rect x="371" y="122" width="105" height="178" rx="10" fill="#2a5298"/><text x="423" y="154" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">MB</text><text x="423" y="176" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">una foto</text><text x="423" y="191" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">o canción</text><text x="365" y="114" font-size="13" fill="#6b7280" font-weight="700" text-anchor="middle">×1024</text><rect x="488" y="86" width="105" height="214" rx="10" fill="#ff6b6b"/><text x="540" y="118" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">GB</text><text x="540" y="140" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">una película</text><text x="482" y="78" font-size="13" fill="#6b7280" font-weight="700" text-anchor="middle">×1024</text><rect x="605" y="50" width="105" height="250" rx="10" fill="#e67e22"/><text x="657" y="82" font-size="22" fill="#ffffff" font-weight="800" text-anchor="middle">TB</text><text x="657" y="104" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">miles de</text><text x="657" y="119" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">películas</text><text x="599" y="42" font-size="13" fill="#6b7280" font-weight="700" text-anchor="middle">×1024</text>
</svg>
