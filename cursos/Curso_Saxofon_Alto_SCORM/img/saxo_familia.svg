<text x="510" y="358" font-size="12" fill="#555" text-anchor="middle">en Mi♭</text>
<text x="310" y="22" font-size="14" fill="#555" text-anchor="middle">Cuanto más grande, más grave. Este curso es del saxo alto (en rojo).</text>
