<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="La familia del saxofón: soprano, alto, tenor y barítono, con su afinación" font-family="Segoe UI,Tahoma,sans-serif">
