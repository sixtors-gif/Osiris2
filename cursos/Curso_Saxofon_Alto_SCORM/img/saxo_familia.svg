<text x="230" y="358" font-size="12" fill="#555" text-anchor="middle">en Mi♭</text>
<rect x="340" y="140" width="22" height="170" rx="10" fill="#e8c868" stroke="#8a5a14" stroke-width="2"/>
<path d="M362 290 Q394 320 410 280 L410 250 L392 250 Z" fill="#c9962b" stroke="#8a5a14" stroke-width="2"/>
