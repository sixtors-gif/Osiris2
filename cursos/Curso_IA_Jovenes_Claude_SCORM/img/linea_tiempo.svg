<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Línea de tiempo de la inteligencia artificial de 1950 a 2023" font-family="Segoe UI,Tahoma,sans-serif">
<rect width="960" height="340" fill="#fff"/>
<line x1="30" y1="170" x2="930" y2="170" stroke="#4b3a8f" stroke-width="5" stroke-linecap="round"/>
<line x1="70" y1="170" x2="70" y2="122" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="70" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="70" y="62" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">1950</text>
<text x="70" y="78" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Turing: ¿pueden</text>
<text x="70" y="92" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">pensar las</text>
<text x="70" y="106" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">máquinas?</text>
<line x1="170" y1="170" x2="170" y2="218" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="170" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="170" y="240" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">1956</text>
<text x="170" y="256" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Dartmouth: nace</text>
<text x="170" y="270" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">el término «IA»</text>
<line x1="270" y1="170" x2="270" y2="122" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="270" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="270" y="62" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">1966</text>
<text x="270" y="78" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">ELIZA, el primer</text>
<text x="270" y="92" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">chatbot</text>
<line x1="370" y1="170" x2="370" y2="218" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="370" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="370" y="240" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">1997</text>
<text x="370" y="256" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Deep Blue gana a</text>
<text x="370" y="270" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Kasparov</text>
<line x1="470" y1="170" x2="470" y2="122" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="470" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="470" y="62" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">2012</text>
<text x="470" y="78" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Deep learning:</text>
<text x="470" y="92" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">AlexNet gana</text>
<text x="470" y="106" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">ImageNet</text>
<line x1="570" y1="170" x2="570" y2="218" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="570" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="570" y="240" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">2016</text>
<text x="570" y="256" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">AlphaGo gana a</text>
<text x="570" y="270" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Lee Sedol</text>
<line x1="670" y1="170" x2="670" y2="122" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="670" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="670" y="62" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">2017</text>
<text x="670" y="78" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Transformers:</text>
<text x="670" y="92" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">«Attention is all</text>
<text x="670" y="106" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">you need»</text>
<line x1="770" y1="170" x2="770" y2="218" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="770" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="770" y="240" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">2022</text>
<text x="770" y="256" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">ChatGPT llega al</text>
<text x="770" y="270" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">gran público</text>
<line x1="870" y1="170" x2="870" y2="122" stroke="#b9afd6" stroke-width="1.5"/>
<circle cx="870" cy="170" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="870" y="62" font-size="15" fill="#4b3a8f" text-anchor="middle" font-weight="700">2023</text>
<text x="870" y="78" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Primer Claude, de</text>
<text x="870" y="92" font-size="11.5" fill="#333" text-anchor="middle" font-weight="400">Anthropic</text>
<rect x="290" y="252" width="0" height="0"/>
<rect x="300" y="162" width="40" height="16" rx="8" fill="#9fb4d6" opacity=".85"/>
<text x="320.0" y="198" font-size="10.5" fill="#3b5b8f" text-anchor="middle" font-weight="400">«inviernos de la IA»</text>
<text x="480" y="322" font-size="11" fill="#777" text-anchor="middle" font-weight="400">Los años no están a escala: entre 1966 y 1997 pasaron décadas de altibajos; entre 2012 y 2023, solo once años.</text>
</svg>