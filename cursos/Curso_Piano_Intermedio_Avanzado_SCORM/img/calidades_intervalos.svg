<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-label="Las dos familias de intervalos" font-family="Segoe UI,Tahoma,sans-serif">
<rect width="680" height="250" fill="#fff"/>
<defs><marker id="fl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#555"/></marker></defs>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1e3c72">Familia de las justas: 4.ª, 5.ª y 8.ª</text>
<rect x="96.0" y="34" width="120" height="44" rx="10" fill="#f4b6b6" stroke="#1e3c72"/>
<text x="156.0" y="61" font-size="14" font-weight="700" text-anchor="middle" fill="#0f1b33">disminuida</text>
<rect x="260.0" y="34" width="120" height="44" rx="10" fill="#ffd166" stroke="#1e3c72"/>
<text x="320.0" y="61" font-size="14" font-weight="700" text-anchor="middle" fill="#0f1b33">JUSTA</text>
<line x1="220.0" y1="56.0" x2="256.0" y2="56.0" stroke="#555" stroke-width="2" marker-end="url(#fl)"/>
<text x="238.0" y="94" font-size="11" text-anchor="middle" fill="#555">+1 st</text>
<rect x="424.0" y="34" width="120" height="44" rx="10" fill="#f4b6b6" stroke="#1e3c72"/>
