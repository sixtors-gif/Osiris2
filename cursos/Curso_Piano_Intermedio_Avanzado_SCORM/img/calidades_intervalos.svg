<text x="238.0" y="173" font-size="14" font-weight="700" text-anchor="middle" fill="#0f1b33">menor</text>
<line x1="138" y1="168.0" x2="174" y2="168.0" stroke="#555" stroke-width="2" marker-end="url(#fl)"/>
<text x="156.0" y="206" font-size="11" text-anchor="middle" fill="#555">+1 st</text>
<rect x="342" y="146" width="120" height="44" rx="10" fill="#ffd166" stroke="#1e3c72"/>
<text x="402.0" y="173" font-size="14" font-weight="700" text-anchor="middle" fill="#0f1b33">MAYOR</text>
<line x1="302" y1="168.0" x2="338" y2="168.0" stroke="#555" stroke-width="2" marker-end="url(#fl)"/>
<text x="320.0" y="206" font-size="11" text-anchor="middle" fill="#555">+1 st</text>
<rect x="506" y="146" width="120" height="44" rx="10" fill="#f4b6b6" stroke="#1e3c72"/>
<text x="566.0" y="173" font-size="14" font-weight="700" text-anchor="middle" fill="#0f1b33">aumentada</text>
<line x1="466" y1="168.0" x2="502" y2="168.0" stroke="#555" stroke-width="2" marker-end="url(#fl)"/>
<text x="484.0" y="206" font-size="11" text-anchor="middle" fill="#555">+1 st</text>
<text x="14" y="242" font-size="12" fill="#555">Cada flecha = un semitono más (st = semitono). Hacia la izquierda, un semitono menos.</text>
