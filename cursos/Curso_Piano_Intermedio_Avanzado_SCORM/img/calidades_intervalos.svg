<text x="402.0" y="94" font-size="11" text-anchor="middle" fill="#555">+1 st</text>
<text x="14" y="136" font-size="14" font-weight="700" fill="#1e3c72">Familia de las mayores y menores: 2.ª, 3.ª, 6.ª y 7.ª</text>
