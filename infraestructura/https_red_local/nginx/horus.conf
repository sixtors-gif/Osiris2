server {
    listen 443 ssl;
    server_name horus.com www.horus.com;
    ssl_certificate     /etc/nginx/certs/horus.com.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/horus.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
}
server {
    listen 80;
    server_name horus.com www.horus.com;
    return 301 https://$host$request_uri;
}
